[project]
name = "recsys"
version = "0.1.0"
description = "Production-minded recommender system practice on GCP (two-tower / Vector Search / Bigtable / realtime reranker)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "google-cloud-bigquery>=3.25",
    "google-cloud-storage>=2.18",
]

[dependency-groups]
dev = [
    "kaggle>=1.6",
    "pre-commit>=3.7",
    "pytest>=8.2",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recsys"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# 行長はフォーマッタに任せる（日本語コメントは全角=幅2で数えられ誤検知が多い）
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
